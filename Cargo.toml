[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.5.5"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
authors = ["FMLibreEditor contributors"]

[workspace.dependencies]
fmlibre-mem = { path = "crates/fmlibre-mem" }
fmlibre-core = { path = "crates/fmlibre-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The standalone tools' window: no web view, no Tauri (see crates/fm27-growth-gui).
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }

# Size-oriented release settings recommended by Tauri: https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The standalone tools' window, built for size without the app release build's full LTO. A full build is quicker and
# an incremental one much quicker; the exe is the same size as with thin LTO. Pair it with `-j 2` (see `cargo gui`) so
# a rebuild does not take every core.
[profile.gui]
inherits = "release"
opt-level = "s"
lto = false
codegen-units = 1
panic = "abort"
strip = true
